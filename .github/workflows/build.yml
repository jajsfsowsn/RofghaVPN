name: Build Rofgha VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Clone Xray Core
      run: git clone --depth 1 https://github.com/XTLS/Xray-core.git
      
    - name: Build Xray for Android (ARM64)
      run: |
        cd Xray-core
        mkdir -p ../app/src/main/assets
        GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
          go build -o ../app/src/main/assets/xray-arm64 \
          -trimpath -ldflags="-s -w" ./main
        cd ..
        
    - name: Build Xray for Android (x86_64)
      run: |
        cd Xray-core
        GOOS=android GOARCH=amd64 CGO_ENABLED=0 \
          go build -o ../app/src/main/assets/xray-x64 \
          -trimpath -ldflags="-s -w" ./main
        cd ..
        
    - name: Build Xray for Android (x86)
      run: |
        cd Xray-core
        GOOS=android GOARCH=386 CGO_ENABLED=0 \
          go build -o ../app/src/main/assets/xray-x86 \
          -trimpath -ldflags="-s -w" ./main
        cd ..
        
    - name: Make binaries executable
      run: chmod +x app/src/main/assets/*
      
    - name: Build APK
      run: |
        cd app
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RofghaVPN
        path: app/build/outputs/apk/debug/app-debug.apk
